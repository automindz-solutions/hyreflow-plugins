<!doctype html>
<!--
  hyreflow results view: reference template (see ../SKILL.md). One renderer, three kinds of data:
  candidates (a shortlist), jobs (open roles / hiring signals), bd (accounts and contacts being pitched).
  FIXED: logo, :root tokens, type, backdrop, component styles, motion. Don't restyle.
  ADAPT: replace the whole DATA object below with real data and the config the user wants.
  The sample data is fictional; none of it may ship.
  Every value is rendered with textContent, so data is escaped. Keep it that way if you edit the script.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Candidate shortlist · hyreflow</title>
<style>
  :root {
    --canvas: #fafaf7; --surface: #ffffff; --surface-soft: #f5f3ec; --surface-warm: #f0ede4;
    --ink: #0a0a0a; --body: #3f3f3a; --muted: #67655e; --ash: #9a9890;
    --hairline: #e7e4dc; --hairline-strong: #d6d2c8;
    --accent: #cc785c; --accent-deep: #9d5138; --accent-soft: #f0d7cc; --ok: #4a9d5c; --ok-soft: #e3f0e5;
    --sans: Geist, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --ease: cubic-bezier(.22, 1, .36, 1);           /* ease-out-quint */
    --z-sticky: 10; --z-menu: 30; --z-drag: 40;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--canvas); color: var(--body); font: 15px/1.55 var(--sans);
         -webkit-font-smoothing: antialiased; min-height: 100vh; position: relative; overflow-x: hidden; }
  /* Graph-paper backdrop: the site's GridBackdrop (40px tile, anchored right, radial fade). */
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .55;
    background-image: linear-gradient(var(--hairline) 1px, transparent 1px),
                      linear-gradient(90deg, var(--hairline) 1px, transparent 1px);
    background-size: 40px 40px;
    -webkit-mask-image: radial-gradient(ellipse 70% 60% at 100% 30%, #000 0%, rgba(0,0,0,.7) 35%, transparent 75%);
            mask-image: radial-gradient(ellipse 70% 60% at 100% 30%, #000 0%, rgba(0,0,0,.7) 35%, transparent 75%); }
  .page { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 36px 16px 56px; }
  a { color: var(--ink); text-underline-offset: 3px; text-decoration-color: var(--hairline-strong); }
  a:hover { color: var(--accent-deep); text-decoration-color: currentColor; }
  .num { font-variant-numeric: tabular-nums; }
  .label { font-size: 11.5px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  button, select, input { font-family: var(--sans); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---- header ---- */
  .wordmark { height: 26px; width: auto; display: block; margin-bottom: 40px; }
  .eyebrow { color: var(--accent-deep); margin: 0 0 12px; }
  h1 { font-size: clamp(30px, 5vw, 50px); font-weight: 600; letter-spacing: -.03em; color: var(--ink);
       margin: 0; line-height: 1.04; text-wrap: balance; max-width: 26ch; }
  h1 .where { color: var(--ash); font-weight: 500; }
  .meta { color: var(--muted); font-size: 14px; margin: 14px 0 0; max-width: 68ch; text-wrap: pretty; }
  .ledger { display: flex; flex-wrap: wrap; gap: 6px 22px; margin: 26px 0 0; padding: 0; list-style: none; font-size: 14px; }
  .ledger li { display: flex; align-items: baseline; gap: 6px; color: var(--muted); }
  .ledger b { color: var(--ink); font-size: 20px; font-weight: 600; letter-spacing: -.01em; }

  /* composition bar: the mix of one key (tier, stage, source), and a one-click filter on it */
  .mix { display: flex; gap: 4px; margin-top: 18px; max-width: 760px; }
  .mix button { flex: var(--n) 1 0; min-width: 104px; background: none; border: 0; padding: 0; cursor: pointer; text-align: left;
                display: flex; flex-direction: column; gap: 7px; color: var(--body); border-radius: 6px; }
  .mix .bar { height: 10px; border-radius: 4px; background: var(--hairline-strong); transition: opacity .2s var(--ease), transform .2s var(--ease); }
  .mix button:first-child .bar { background: var(--accent); }
  .mix .cap { font-size: 12.5px; display: flex; gap: 6px; align-items: baseline; white-space: nowrap; overflow: hidden; }
  .mix .cap b { font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; }
  .mix button:hover .bar { transform: scaleY(1.35); }
  .mix.filtered button:not([aria-pressed="true"]) .bar { opacity: .3; }
  .mix.filtered button:not([aria-pressed="true"]) .cap { color: var(--muted); }
  @media (max-width: 640px) { .mix { flex-wrap: wrap; row-gap: 10px; } .mix button { flex: 1 1 40%; } }

  /* ---- toolbar: views, sort, search ---- */
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; justify-content: space-between; margin: 36px 0 10px; }
  .tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .seg { display: inline-flex; background: var(--surface-soft); border: 1px solid var(--hairline); border-radius: 10px; padding: 3px; }
  .seg button { font-size: 13px; font-weight: 500; color: var(--muted); background: none; border: 0; border-radius: 6px;
                padding: 6px 14px; cursor: pointer; transition: background .15s, color .15s; }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(10,10,10,.08); }
  .sortbox { display: inline-flex; align-items: center; background: var(--surface); border: 1px solid var(--hairline-strong);
             border-radius: 10px; height: 36px; overflow: hidden; }
  .sortbox label { font-size: 12.5px; color: var(--muted); padding: 0 4px 0 12px; }
  .sortbox select { appearance: none; border: 0; background: transparent; font-size: 13.5px; font-weight: 500; color: var(--ink);
                    padding: 0 8px 0 2px; height: 100%; cursor: pointer; }
  .sortbox select:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--accent-soft); }
  .sortbox button { border: 0; border-left: 1px solid var(--hairline); background: var(--surface-soft); height: 100%; width: 34px;
                    cursor: pointer; font-size: 14px; color: var(--ink); }
  .sortbox button:hover { background: var(--surface-warm); }
  .searchbox { position: relative; }
  .search { font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--hairline-strong);
            border-radius: 10px; padding: 0 34px 0 12px; height: 36px; width: 250px; max-width: 100%; }
  .search::placeholder { color: var(--muted); opacity: 1; }
  .search:focus { outline: 2px solid var(--accent-soft); outline-offset: 0; border-color: var(--accent); }
  .searchbox kbd { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); pointer-events: none; }
  kbd { font: 500 11px var(--sans); border: 1px solid var(--hairline-strong); border-bottom-width: 2px; border-radius: 6px;
        padding: 0 5px; background: var(--surface); color: var(--body); }
  .linkbtn { font-size: 13px; font-weight: 500; color: var(--accent-deep); background: none; border: 0; padding: 0; cursor: pointer;
             text-decoration: underline; text-underline-offset: 3px; }

  /* ---- filter bar: one dropdown per facet + the active chips ---- */
  .filterbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 18px; }
  .facet { position: relative; }
  .facet > summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px;
                     border: 1px solid var(--hairline-strong); border-radius: 999px; background: var(--surface); font-size: 13px;
                     color: var(--body); user-select: none; }
  .facet > summary::-webkit-details-marker { display: none; }
  .facet > summary::after { content: ""; width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
                            transform: translateY(-2px) rotate(45deg); opacity: .6; }
  .facet[open] > summary, .facet > summary:hover { border-color: var(--ink); color: var(--ink); }
  .facet.on > summary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .facet .n { font-size: 11.5px; font-weight: 600; background: var(--accent-soft); color: var(--accent-deep); border-radius: 999px; padding: 0 6px; }
  .menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: var(--z-menu); min-width: 220px; max-height: 300px; overflow: auto;
          background: var(--surface); border: 1px solid var(--hairline-strong); border-radius: 12px; padding: 6px;
          box-shadow: 0 18px 40px -20px rgba(10,10,10,.35); animation: menu-in .16s var(--ease); }
  @keyframes menu-in { from { opacity: 0; transform: translateY(-4px); } }
  .menu label { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 8px; font-size: 13.5px; cursor: pointer; }
  .menu label:hover { background: var(--surface-soft); }
  .menu input { accent-color: var(--accent-deep); width: 15px; height: 15px; margin: 0; }
  .menu .c { margin-left: auto; color: var(--muted); font-size: 12px; }
  .active { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 6px 0 10px; border-radius: 999px;
            background: var(--accent-soft); color: var(--accent-deep); font-size: 12.5px; font-weight: 500; }
  .active button { border: 0; background: none; color: inherit; cursor: pointer; width: 18px; height: 18px; border-radius: 50%; font-size: 13px; line-height: 1; }
  .active button:hover { background: rgba(157,81,56,.15); }
  .count { color: var(--muted); font-size: 13px; margin-left: auto; }

  /* ---- shared bits ---- */
  .avatar { width: 40px; height: 40px; border-radius: 50%; flex: none; display: grid; place-items: center;
            font-weight: 600; font-size: 14px; background: var(--surface-warm); color: var(--ink); }
  .avatar.co { border-radius: 10px; background: var(--ink); color: #fff; }
  .avatar.t1 { background: var(--accent-soft); color: var(--accent-deep); }
  .avatar { position: relative; overflow: hidden; }
  .avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .name { font-size: 16.5px; font-weight: 600; color: var(--ink); letter-spacing: -.01em; margin: 0; text-decoration: none; }
  .role { color: var(--muted); font-size: 13.5px; margin: 2px 0 0;
          display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tier, .tag { font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap;
                background: var(--surface-soft); color: var(--body); border: 1px solid var(--hairline); }
  .tier.t1 { background: var(--accent-soft); color: var(--accent-deep); border-color: transparent; }
  .tag.fresh { background: var(--ok-soft); color: #2f6f3c; border-color: transparent; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--surface-soft); color: var(--body); }
  .chip.hit { background: var(--accent-soft); color: var(--accent-deep); }
  .score { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--muted); }
  .score .track { flex: 1; height: 4px; background: var(--surface-soft); border-radius: 4px; overflow: hidden; }
  .score .track i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
  /* LinkedIn: the one third-party mark on the page, in LinkedIn's own blue so it reads at a glance */
  .li { display: inline-flex; align-items: center; gap: 6px; color: #0a66c2; text-decoration: none; font-weight: 500; flex: none; }
  .li svg { width: 16px; height: 16px; display: block; fill: currentColor; }
  .li:hover { color: #004182; }
  .li.icon { width: 24px; height: 24px; justify-content: center; border-radius: 6px; }
  .li.icon:hover { background: #e8f1fb; }
  .ext::after { content: " ↗"; }
  .contact { font-size: 12.5px; color: var(--muted); }
  .contact .ok { color: var(--ok); font-weight: 500; }
  .contact .ok::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: currentColor;
                         margin-right: 6px; vertical-align: 1px; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; font-size: 13px; margin: 0; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; color: var(--body); }
  .person { display: flex; align-items: center; gap: 10px; font-size: 13.5px; }
  .person .avatar { width: 28px; height: 28px; font-size: 11px; }
  .person b { color: var(--ink); font-weight: 600; } .person span { color: var(--muted); }
  .signal { font-size: 13.5px; color: var(--ink); background: var(--surface-soft); border-radius: 8px; padding: 8px 10px; margin: 0; }
  .signal::before { content: "Why now  "; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-deep); }
  .msg { font-size: 13.5px; color: var(--body); border-left: 2px solid var(--hairline-strong); padding: 2px 0 2px 12px; margin: 0;
         white-space: pre-wrap; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .copy { font-size: 12.5px; font-weight: 500; border: 1px solid var(--hairline-strong); background: var(--surface); color: var(--ink);
          border-radius: 8px; padding: 4px 10px; cursor: pointer; }
  .copy:hover { border-color: var(--ink); }
  .copy[data-done] { background: var(--ok-soft); border-color: transparent; color: #2f6f3c; }
  .when { font-size: 12.5px; color: var(--muted); }

  /* ---- cards ---- */
  .group + .group { margin-top: 36px; }
  .ghead { margin: 0 0 14px; font-size: 15px; font-weight: 600; color: var(--ink); display: flex; gap: 8px; align-items: baseline; }
  .ghead .num { color: var(--muted); font-weight: 500; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr)); gap: 14px; }
  .card { background: var(--surface); border: 1px solid var(--hairline); border-radius: 14px; padding: 18px;
          display: flex; flex-direction: column; gap: 12px; transition: border-color .18s var(--ease), box-shadow .18s var(--ease); }
  .card:hover { border-color: var(--hairline-strong); box-shadow: 0 10px 30px -18px rgba(10,10,10,.28); }
  .head { display: flex; gap: 12px; align-items: flex-start; }
  .head > div:not(.avatar) { flex: 1; min-width: 0; }
  .fit { margin: 0; color: var(--body); text-wrap: pretty; }
  .clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .foot { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 13px;
          margin-top: auto; padding-top: 12px; border-top: 1px solid var(--hairline); }
  .foot > :last-child:not(:first-child) { margin-left: auto; }

  /* ---- table ---- */
  .table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--hairline); border-radius: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  th { text-align: left; background: var(--surface-soft); padding: 0; white-space: nowrap; }
  th button { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 6px; width: 100%; padding: 11px 14px; cursor: pointer;
              font-size: 11.5px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  th button:hover { color: var(--ink); }
  th button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  th button::after { content: "↕"; opacity: 0; font-size: 12px; letter-spacing: 0; transition: opacity .15s; }
  th button:hover::after { opacity: .45; }
  th[aria-sort] button { color: var(--ink); }
  th[aria-sort="ascending"] button::after { content: "↑"; opacity: 1; color: var(--accent-deep); }
  th[aria-sort="descending"] button::after { content: "↓"; opacity: 1; color: var(--accent-deep); }
  td { padding: 12px 14px; border-top: 1px solid var(--hairline); vertical-align: top; }
  tbody tr { cursor: pointer; transition: background .12s; }
  tbody tr:hover td { background: #fcfbf8; }
  td .who { display: flex; gap: 10px; align-items: center; min-width: 230px; }
  td .who > div:not(.avatar) { flex: 1; min-width: 0; }
  td .avatar { width: 32px; height: 32px; font-size: 12px; }
  td .name { font-size: 14.5px; }
  td.wide { min-width: 260px; max-width: 420px; }
  td .chips { min-width: 220px; }
  td .contact, td .when { white-space: nowrap; }
  td .person { min-width: 220px; }

  /* ---- board ---- */
  .hint { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; justify-content: space-between;
          font-size: 12.5px; color: var(--muted); margin: 0 0 12px; }
  .board { display: flex; gap: 12px; align-items: flex-start; overflow-x: auto; padding: 2px 2px 12px; scroll-snap-type: x proximity; }
  .col { flex: 1 1 0; min-width: 256px; max-width: 360px; scroll-snap-align: start; display: flex; flex-direction: column;
         max-height: 78vh; background: var(--surface-soft); border: 1px solid var(--hairline); border-radius: 14px;
         transition: border-color .15s var(--ease), background-color .15s var(--ease); }
  .col.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent-soft) 40%, var(--surface-soft)); }
  .col-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px 10px; }
  .col-head h3 { margin: 0; flex: 1; font-size: 13.5px; font-weight: 600; color: var(--ink); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ash); flex: none; }
  .col.first .dot { background: var(--accent); }
  .col.last .dot { background: var(--ok); }
  .col-head .n { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--surface); border: 1px solid var(--hairline);
                 border-radius: 999px; padding: 0 8px; }
  .col-body { display: flex; flex-direction: column; gap: 8px; padding: 0 10px 10px; overflow-y: auto; min-height: 96px; }
  .drop { border: 1px dashed var(--hairline-strong); border-radius: 10px; color: var(--muted); font-size: 12.5px;
          text-align: center; padding: 22px 10px; }
  .col-body:has(.slot) .drop { display: none; }
  .slot { border-radius: 10px; background: color-mix(in srgb, var(--accent-soft) 55%, transparent);
          border: 1px dashed var(--accent); flex: none; }
  .kcard { min-width: 0; background: var(--surface); border: 1px solid var(--hairline); border-radius: 10px; padding: 12px;
           display: flex; flex-direction: column; gap: 8px; cursor: grab; user-select: none;
           transition: box-shadow .18s var(--ease), border-color .18s var(--ease); }
  .kcard:hover { border-color: var(--hairline-strong); box-shadow: 0 10px 24px -16px rgba(10,10,10,.4); }
  .kcard.landed { animation: land .6s var(--ease); }
  @keyframes land { from { box-shadow: 0 0 0 3px var(--accent-soft); border-color: var(--accent); } }
  .ghost { position: fixed; left: 0; top: 0; z-index: var(--z-drag); pointer-events: none; margin: 0; cursor: grabbing;
           box-shadow: 0 24px 48px -18px rgba(10,10,10,.45), 0 2px 6px rgba(10,10,10,.08); border-color: var(--hairline-strong);
           will-change: transform; }
  body.dragging, body.dragging * { cursor: grabbing !important; user-select: none; }
  .ktop { display: flex; gap: 10px; align-items: center; }
  .ktop .avatar { width: 30px; height: 30px; font-size: 11.5px; }
  .ktop .avatar.co { border-radius: 8px; }
  .ktop > div:not(.avatar) { flex: 1; min-width: 0; }
  .kname { font-size: 14px; font-weight: 600; color: var(--ink); margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ktitle { font-size: 12.5px; color: var(--muted); margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kscore { font-size: 12px; font-weight: 600; color: var(--accent-deep); background: var(--accent-soft); border-radius: 6px; padding: 1px 6px; }
  .kline { font-size: 12.5px; color: var(--body); margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .kmeta { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); min-height: 24px; }
  .kmeta > span:not(.tier):not(.tag) { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kmeta .tier, .kmeta .tag { flex: none; font-size: 11px; padding: 1px 7px; }
  .kcard .chip { font-size: 11.5px; padding: 1px 7px; }
  .moves { margin-left: auto; flex: none; display: flex; gap: 4px; opacity: 0; transition: opacity .15s var(--ease); }
  .kcard:hover .moves, .kcard:focus-within .moves { opacity: 1; }
  .moves button, .grip { width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--hairline); background: var(--surface);
                         color: var(--body); cursor: pointer; font-size: 13px; font-weight: 600; line-height: 1; padding: 0; }
  .moves button:hover { border-color: var(--ink); color: var(--ink); }
  .moves button:disabled { opacity: .35; cursor: default; border-color: var(--hairline); color: var(--body); }
  .grip { display: none; touch-action: none; cursor: grab; letter-spacing: -2px; }
  @media (hover: none) { .moves { opacity: 1; } .grip { display: inline-grid; place-items: center; } }

  /* ---- detail sheet ---- */
  dialog.sheet { margin: 0 0 0 auto; height: 100vh; max-height: 100vh; width: min(480px, 100vw); max-width: 100vw;
                 border: 0; border-left: 1px solid var(--hairline); padding: 0; background: var(--canvas); color: var(--body); }
  dialog.sheet::backdrop { background: rgba(10,10,10,.28); }
  dialog.sheet[open] { animation: sheet-in .28s var(--ease); }
  dialog.sheet[open]::backdrop { animation: fade-in .28s var(--ease); }
  @keyframes sheet-in { from { transform: translateX(32px); opacity: 0; } }
  @keyframes fade-in { from { opacity: 0; } }
  .sbar { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--hairline);
          position: sticky; top: 0; z-index: var(--z-sticky); background: var(--canvas); }
  .sbar button { font-size: 13px; font-weight: 500; border: 1px solid var(--hairline-strong); background: var(--surface); color: var(--ink);
                 border-radius: 8px; padding: 5px 12px; cursor: pointer; }
  .sbody { padding: 20px 18px; }

    }
  };

  // ---------- board cards + physical drag ----------
  let suppressClick = false;
  const focusCard = (i) => { const f = document.querySelector('.kcard[data-i="' + i + '"]'); if (f) f.focus({ preventScroll: true }); };
  const kcard = (c, cols, gi) => {
    const i = idx(c);
    const n = tag(el("article", "kcard" + (landed === i ? " landed" : "")), c);
    n.tabIndex = 0; n.dataset.i = i;
    n.setAttribute("aria-label", titleOf(c) + ". In " + cols[gi] + ". Press Enter for details.");
    n.onclick = (e) => { if (suppressClick) { suppressClick = false; return; } if (!e.target.closest("a, button")) openSheet(c); };
    n.onkeydown = (e) => { if (e.target !== n) return;
      const step = (d) => { const g = cols[gi + d]; if (!g) return; e.preventDefault();
        vt(() => { commit(c, g, null); draw(); focusCard(i); }); announce(titleOf(c) + " moved to " + g); };
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openSheet(c); }
      else if (e.key === "ArrowRight") step(1);
      else if (e.key === "ArrowLeft") step(-1);
      else if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault();
        const sib = e.key === "ArrowDown" ? n.nextElementSibling : n.previousElementSibling; if (sib && sib.classList.contains("kcard")) sib.focus(); } };
    n.addEventListener("pointerdown", (e) => pointerDown(e, c, n));
    const top = el("div", "ktop"), who = el("div");
    who.append(el("p", "kname", titleOf(c)));
    const second = kind === "candidates" ? c.title : kind === "jobs" ? c.company : c.contact && has(c.contact.name)
      ? c.contact.name + (has(c.contact.title) ? ", " + c.contact.title : "") : c.industry;
    if (has(second)) who.append(el("p", "ktitle", second));
    top.append(avatar(c), who);
    const li = kind === "candidates" ? candLI(c, false) : kind === "bd" && c.contact ? liLink(c.contact.linkedin, c.contact.name, false) : null;
    if (li) top.append(li);
    if (typeof c.score === "number") top.append(el("span", "kscore num", c.score));
    const grip = btn("grip", "⋮⋮", null, "Drag " + titleOf(c)); grip.tabIndex = -1; top.append(grip);
    n.append(top);
    if (kind === "bd" && has(c.signal)) n.append(el("p", "kline", c.signal));
    if (kind === "jobs" && has(c.summary)) n.append(el("p", "kline", c.summary));
    if (kind === "candidates") { const chips = skillChips(c, 3); if (chips) n.append(chips); }
    const meta = el("div", "kmeta");
    if (kind === "candidates") { if (C.stages && has(c.tier)) meta.append(el("span", "tier" + (isTop(c) ? " t1" : ""), c.tier));
      const where = has(c.company) ? c.company : c.location; if (has(where)) meta.append(el("span", "", where)); }
    if (kind === "jobs") { const f = fresh(c); if (f) meta.append(f); if (has(c.location)) meta.append(el("span", "", c.location)); }
    if (kind === "bd") { if (has(c.channel)) meta.append(el("span", "tag", c.channel)); const a = ago(c.lastTouch); if (a) meta.append(el("span", "", a)); }
    const mv = el("div", "moves");
    const l = btn("", "‹", (e) => { e.stopPropagation(); vt(() => { commit(c, cols[gi - 1], null); draw(); }); }, gi > 0 ? "Move to " + cols[gi - 1] : "");
    const r = btn("", "›", (e) => { e.stopPropagation(); vt(() => { commit(c, cols[gi + 1], null); draw(); }); }, gi < cols.length - 1 ? "Move to " + cols[gi + 1] : "");
    l.disabled = gi === 0; r.disabled = gi === cols.length - 1; l.tabIndex = r.tabIndex = -1;
    mv.append(l, r); meta.append(mv); n.append(meta);
    return n;
  };

  let drag = null;
  const pointerDown = (e, c, n) => {
    if (drag) return;                                                        // previous drop still settling
    if (e.button !== 0 || (e.target.closest("a, button") && !e.target.closest(".grip"))) return;
    if (e.pointerType === "touch" && !e.target.closest(".grip")) return;     // touch: drag by the grip, the body scrolls
    const r = n.getBoundingClientRect();
    drag = { c, n, sx: e.clientX, sy: e.clientY, x: e.clientX, y: e.clientY, ox: e.clientX - r.left, oy: e.clientY - r.top,
             rect: r, started: false, vx: 0, lastX: e.clientX, pid: e.pointerId };
    addEventListener("pointermove", pointerMove, { passive: false });
    addEventListener("pointerup", pointerUp); addEventListener("pointercancel", cancelDrag);
    addEventListener("keydown", escDrag);
  };
  const startDrag = () => {
    const { n, rect } = drag;
    const ghost = n.cloneNode(true); ghost.classList.add("ghost"); ghost.style.width = rect.width + "px";
    ghost.style.viewTransitionName = "none"; ghost.removeAttribute("tabindex");
    const slot = el("div", "slot"); slot.style.height = rect.height + "px";
    n.after(slot); n.style.display = "none"; document.body.append(ghost); document.body.classList.add("dragging");
    Object.assign(drag, { ghost, slot, started: true, board: n.closest(".board") });
    ghost.animate([{ scale: 1 }, { scale: 1.035 }], { duration: reduce.matches ? 0 : 160, easing: "cubic-bezier(.22,1,.36,1)", fill: "forwards" });
    requestAnimationFrame(tick);
  };
  const pointerMove = (e) => {
    if (!drag || e.pointerId !== drag.pid) return;
    drag.x = e.clientX; drag.y = e.clientY;
    if (!drag.started) { if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 5) return; startDrag(); }
    e.preventDefault();
    drag.vx = drag.vx * .75 + (e.clientX - drag.lastX) * .25; drag.lastX = e.clientX;
    const tilt = reduce.matches ? 0 : Math.max(-5, Math.min(5, drag.vx * .5));
    drag.ghost.style.transform = `translate(${e.clientX - drag.ox}px, ${e.clientY - drag.oy}px) rotate(${tilt}deg)`;
    placeSlot(e.clientX, e.clientY);
  };
  // FLIP: record every visible board card's box, move the slot, then glide the cards from old box to new.
  const flip = (mutate) => {
    const cards = [...document.querySelectorAll(".board .kcard")].filter((k) => k.style.display !== "none");
    const before = new Map(cards.map((k) => [k, k.getBoundingClientRect()]));
    mutate();
    if (reduce.matches) return;
    cards.forEach((k) => { const a = before.get(k), b = k.getBoundingClientRect(), dx = a.left - b.left, dy = a.top - b.top;
      if (dx || dy) k.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: "none" }], { duration: 220, easing: "cubic-bezier(.22,1,.36,1)" }); });
  };
  const placeSlot = (x, y) => {
    const target = document.elementFromPoint(x, y), col = target && target.closest(".col");
    document.querySelectorAll(".col.over").forEach((k) => k !== col && k.classList.remove("over"));
    if (!col) return;
    col.classList.add("over");
    const body = col.querySelector(".col-body");
    const cards = [...body.querySelectorAll(".kcard")].filter((k) => k.style.display !== "none");
    const next = cards.find((k) => { const r = k.getBoundingClientRect(); return y < r.top + r.height / 2; }) || null;
    const { slot } = drag;
    if (slot.parentNode === body && (next ? slot.nextElementSibling === next : !cards.some((k) => slot.compareDocumentPosition(k) & Node.DOCUMENT_POSITION_FOLLOWING))) return;
    flip(() => { if (next) body.insertBefore(slot, next); else body.append(slot); });
  };
  const tick = () => {
    if (!drag || !drag.started) return;
    const { x, y, board } = drag, br = board.getBoundingClientRect(), edge = 56;
    if (x > br.right - edge) board.scrollLeft += Math.ceil((x - (br.right - edge)) / 4);
    else if (x < br.left + edge) board.scrollLeft -= Math.ceil(((br.left + edge) - x) / 4);
    const col = document.querySelector(".col.over .col-body");
    if (col) { const cr = col.getBoundingClientRect();
      if (y > cr.bottom - 40) col.scrollTop += 8; else if (y < cr.top + 40) col.scrollTop -= 8; }
    if (y > innerHeight - 40) scrollBy(0, 10); else if (y < 40) scrollBy(0, -10);
    requestAnimationFrame(tick);
  };
  const endListeners = () => { removeEventListener("pointermove", pointerMove); removeEventListener("pointerup", pointerUp);
    removeEventListener("pointercancel", cancelDrag); removeEventListener("keydown", escDrag); };
  const settle = (to, done) => {
    const { ghost } = drag;
    const dur = reduce.matches ? 0 : 240;
    const a = ghost.animate([{ transform: ghost.style.transform, scale: 1.035 },
                             { transform: `translate(${to.left}px, ${to.top}px) rotate(0deg)`, scale: 1 }],
                            { duration: dur, easing: "cubic-bezier(.22,1,.36,1)", fill: "forwards" });
    const fin = () => { ghost.remove(); document.body.classList.remove("dragging");
      document.querySelectorAll(".col.over").forEach((k) => k.classList.remove("over")); done(); };
    if (dur) a.onfinish = fin; else fin();
  };
  const pointerUp = (e) => {
    if (!drag || e.pointerId !== drag.pid) return;
    endListeners();
    if (!drag.started) { drag = null; return; }
    suppressClick = true; setTimeout(() => { suppressClick = false; }, 0);
    const d = drag, col = d.slot.closest(".col");
    const nextCard = d.slot.nextElementSibling && d.slot.nextElementSibling.classList.contains("kcard") ? +d.slot.nextElementSibling.dataset.i : null;
    settle(d.slot.getBoundingClientRect(), () => {
      drag = null;
      if (col) { commit(d.c, col.dataset.g, nextCard); announce(titleOf(d.c) + " moved to " + col.dataset.g); }
      draw(); focusCard(idx(d.c));
    });
  };
  const cancelDrag = () => {
    if (!drag) return; endListeners();
    if (!drag.started) { drag = null; return; }
    const d = drag; settle(d.rect, () => { drag = null; draw(); });
  };
  const escDrag = (e) => { if (e.key === "Escape") { e.preventDefault(); cancelDrag(); } };

  // polite status for screen readers
  const live = el("div"); live.setAttribute("aria-live", "polite"); live.style.cssText = "position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)";
  document.body.append(live);
  const announce = (msg) => { live.textContent = msg; };

  function draw() {
    Object.entries(filters).forEach(([k, s]) => { const vals = new Set(facetOptions(k).map(([v]) => v)); [...s].forEach((v) => { if (!vals.has(v)) s.delete(v); }); });
    drawLedger(); drawMix(); drawFilters(); syncSort();
    tb.querySelectorAll(".seg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === view)));
    const rows = sorted(items.filter((c) => active().every(([k, set]) => facetVals(c, k).some((v) => set.has(v))) && (!q || searchText(c).includes(q))));
    count.textContent = rows.length === items.length ? "" : rows.length + " of " + items.length + " shown";
    const v = $("view"); v.textContent = "";
    v.append(rows.length ? VIEWS[view](rows) : el("div", "empty", "No " + K.many + " match. Clear the search or a filter."));
    landed = null;
  }
  draw();
})();
</script>
</body>
</html>
